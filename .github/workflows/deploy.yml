name: Publicar no GitHub Pages

on:
  push:
    branches:
      - claude/financial-dashboard-personal-we2oj5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      # Painel de Vida: publicado em /Finan-as-Pessoais/painel-vida/
      - run: npm ci
        working-directory: painel-vida
      - run: npm test
        working-directory: painel-vida
      - run: npm run build
        working-directory: painel-vida
      - run: cp -r painel-vida/dist dist/painel-vida
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
